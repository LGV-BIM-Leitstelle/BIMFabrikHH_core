[tool.poetry]
name = "BIMFabrikHH"
version = "0.1.0"
description = ""
authors = ["Ahmed Salem <ahmed.salem@gv.hamburg.de>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
icosphere = "^0.1.3"
pandas = "^2.2.2"
openpyxl = "^3.1.5"
mathutils = "^3.3.0"
pyvista = "^0.44.2"
rasterio = "^1.4.3"
pydantic = "^2.10.6"
lxml = "^5.3.1"
ifcopenshell = { version = "^0.8.1.post1", extras = ["geometry"] }
manifold3d = "^2.3.1"
colorlog = "^6.9.0"


[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
pytest = "^8.3.4"
pytest-mock = "^3.14.0"
pytest-cov = "^5.0.0"
isort = "^6.0.1"
autoflake = "^2.3.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]